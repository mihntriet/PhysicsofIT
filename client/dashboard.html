<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dashboard giám sát khí gas real-time - Biểu đồ, điều khiển thiết bị, cảnh báo" />
  <title>Gas Monitor - Dashboard</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>" />
</head>
<body>
  <div class="dashboard-page">

    <!-- ═══════════════════════════════════
         NAVBAR
         ═══════════════════════════════════ -->
    <nav class="navbar">
      <div class="navbar-brand">
        <div class="brand-icon">🏭</div>
        <span>Gas Leak Monitor</span>
      </div>

      <div class="navbar-status">
        <div class="connection-status">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">Đang kết nối...</span>
        </div>

        <span id="user-email" style="color: var(--text-muted); font-size: 0.8125rem;"></span>

        <button id="logout-btn" class="btn btn-ghost btn-logout">
          🚪 Đăng xuất
        </button>
      </div>
    </nav>

    <!-- ═══════════════════════════════════
         ALERT BANNER (ẩn mặc định)
         ═══════════════════════════════════ -->
    <div id="alert-banner" class="alert-banner">
      <span class="alert-icon">🚨</span>
      <span id="alert-text" class="alert-text">Cảnh báo rò rỉ khí gas!</span>
      <button class="alert-close">✕</button>
    </div>

    <!-- ═══════════════════════════════════
         DASHBOARD CONTENT
         ═══════════════════════════════════ -->
    <main class="dashboard-content">
      <div class="dashboard-grid">

        <!-- ── Khu vực 1: Giá trị cảm biến Gas ── -->
        <div class="card gas-sensor-card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-icon">🌡️</span>
              Nồng độ Khí Gas
            </div>
            <span class="card-badge live">● LIVE</span>
          </div>

          <div class="gas-value-display">
            <div id="gas-value" class="gas-value-number">0</div>
            <div class="gas-value-unit">Giá trị ADC (0 - 4095)</div>
          </div>

          <div class="gas-threshold-bar">
            <div class="threshold-label">
              <span>Hiện tại: <strong id="threshold-current">0</strong></span>
              <span>Ngưỡng: <strong id="threshold-value">2000</strong></span>
            </div>
            <div class="threshold-track">
              <div id="threshold-fill" class="threshold-fill" style="width: 0%"></div>
              <div class="threshold-marker" style="left: 48.8%"></div>
            </div>
          </div>
        </div>

        <!-- ── Khu vực 2: Điều khiển thiết bị ── -->
        <div class="card control-card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-icon">🎛️</span>
              Điều khiển Thiết bị
            </div>
          </div>

          <div class="control-group">
            <!-- Buzzer Control -->
            <div class="control-item">
              <div class="control-info">
                <div class="control-icon buzzer">🔔</div>
                <div>
                  <div class="control-name">Còi Buzzer</div>
                  <div class="control-status">
                    Trạng thái: <span id="buzzer-status-text" class="status-text off">ĐANG TẮT</span>
                  </div>
                </div>
              </div>
              <label class="toggle-switch">
                <input type="checkbox" id="buzzer-toggle" />
                <span class="toggle-slider"></span>
              </label>
            </div>

            <!-- LED Control -->
            <div class="control-item">
              <div class="control-info">
                <div class="control-icon led">💡</div>
                <div>
                  <div class="control-name">Đèn LED</div>
                  <div class="control-status">
                    Trạng thái: <span id="led-status-text" class="status-text off">ĐANG TẮT</span>
                  </div>
                </div>
              </div>
              <label class="toggle-switch">
                <input type="checkbox" id="led-toggle" />
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>
        </div>

        <!-- ── Khu vực 3: Biểu đồ lịch sử ── -->
        <div class="card chart-card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-icon">📊</span>
              Biểu đồ Nồng độ Gas
            </div>
            <div class="chart-controls">
              <button class="btn-chip" data-limit="20">20 mẫu</button>
              <button class="btn-chip active" data-limit="50">50 mẫu</button>
              <button class="btn-chip" data-limit="100">100 mẫu</button>
              <button class="btn-chip" data-limit="200">200 mẫu</button>
            </div>
          </div>
          <div class="chart-wrapper">
            <canvas id="gas-chart"></canvas>
          </div>
        </div>

      </div>
    </main>

  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Socket.io Client (served by backend) -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
